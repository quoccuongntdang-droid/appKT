<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard Ôn Tập Kinh Thánh</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f2f5; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; box-sizing: border-box; }
        .container { max-width: 450px; width: 100%; background: white; padding: 20px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); box-sizing: border-box; display: flex; flex-direction: column; }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 15px; font-size: 20px; }
        .controls { margin-bottom: 20px; display: flex; flex-direction: column; gap: 10px; width: 100%; }
        select, button, input[type="text"] { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccc; font-size: 15px; box-sizing: border-box; }
        .btn-random { background: #e67e22; color: white; border: none; font-weight: bold; cursor: pointer; }
        .btn-random:hover { background: #d35400; }
        
        /* Box nhập link GitHub */
        .import-box { background: #f8f9fa; padding: 12px; border-radius: 8px; border: 1px dashed #cbd5e1; display: flex; flex-direction: column; gap: 8px; }
        .import-box label { font-size: 13px; color: #475569; font-weight: bold; }
        .btn-fetch { background: #8e44ad; color: white; border: none; font-weight: bold; cursor: pointer; }
        .btn-fetch:hover { background: #732d91; }
        
        /* Hiệu ứng lật thẻ Flashcard */
        .flashcard-container { perspective: 1000px; width: 100%; min-height: 285px; margin-bottom: 20px; cursor: pointer; }
        .flashcard { width: 100%; height: 100%; min-height: 285px; position: relative; transform-style: preserve-3d; transition: transform 0.6s; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); display: flex; }
        .flashcard.flipped { transform: rotateY(180deg); }
        .card-face { position: absolute; width: 100%; height: 100%; min-height: 285px; backface-visibility: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; border-radius: 12px; text-align: center; overflow-y: auto; }
        .card-front { background: #ffffff; border: 2px solid #3498db; color: #2c3e50; }
        .card-back { background: #ebf5fb; border: 2px solid #2980b9; color: #1b4f72; transform: rotateY(180deg); }
        
        .card-title { font-size: 13px; color: #7f8c8d; margin-bottom: 8px; text-transform: uppercase; font-weight: bold; word-break: break-word; width: 100%; }
        .card-ref { font-size: 20px; font-weight: bold; color: #2980b9; word-break: break-word; width: 100%; margin: 10px 0; }
        .card-text { font-size: 15px; line-height: 1.6; word-break: break-word; width: 100%; max-height: 220px; overflow-y: auto; padding-right: 5px; }
        .hint { font-size: 12px; color: #95a5a6; margin-top: 15px; font-style: italic; }

        .nav-buttons { display: flex; gap: 10px; width: 100%; }
        .btn-nav { flex: 1; background: #27ae60; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-nav:hover { background: #219653; }
        .progress { text-align: center; margin-top: 15px; font-size: 14px; color: #555; font-weight: bold; }
        
        .btn-download { background: #2980b9; color: white; border: none; font-size: 13px; padding: 8px; cursor: pointer; }
        .btn-download:hover { background: #1f618d; }
    </style>
</head>
<body>

    <div class="container">
        <h2>📖 Ôn Tập Kinh Thánh</h2>
        
        <div class="controls">
            <select id="lessonSelect" onchange="changeLesson()">
                <option value="">Đang tải cơ sở dữ liệu...</option>
            </select>
            <button class="btn-random" onclick="selectRandomLesson()">🎲 Chọn Bài Ngẫu Nhiên</button>
            
            <div class="import-box">
                <label>🔗 Dán link file Markdown (.md) từ GitHub:</label>
                <input type="text" id="mdUrlInput" placeholder="Ví dụ: https://raw.githubusercontent.com/.../bai.md">
                <button class="btn-fetch" onclick="fetchMarkdownFromUrl()">🚀 Tải & Cập nhật bài học</button>
                <button class="btn-download" id="downloadJsonBtn" style="display: none;" onclick="downloadUpdatedJson()">📥 Tải xuống data.json mới</button>
            </div>
        </div>

        <div class="flashcard-container" onclick="flipCard()">
            <div class="flashcard" id="card">
                <div class="card-face card-front">
                    <div class="card-title" id="frontLessonTitle">Đang tải...</div>
                    <div class="card-ref" id="frontRef">...</div>
                    <div class="hint">(Chạm vào thẻ để lật xem nội dung)</div>
                </div>
                <div class="card-face card-back">
                    <div class="card-title">Nội Dung Kinh Thánh</div>
                    <div class="card-text" id="backText">...</div>
                </div>
            </div>
        </div>

        <div class="nav-buttons">
            <button class="btn-nav" onclick="prevVerse()">⬅️ Câu Trước</button>
            <button class="btn-nav" onclick="nextVerse()">Câu Sau ➡️</button>
        </div>

        <div class="progress" id="progressText">Đang khởi tạo hệ thống...</div>
    </div>

    <script>
        let bibleData = [];
        let currentLessonIndex = 0;
        let currentVerseIndex = 0;
        let isFlipped = false;

        async function loadDatabase() {
            try {
                const response = await fetch('data.json');
                if (!response.ok) throw new Error('Không thể tải file dữ liệu');
                bibleData = await response.json();
                updateLessonSelect();
                loadCard();
            } catch (error) {
                document.getElementById('progressText').textContent = "Lỗi tải dữ liệu data.json!";
                console.error(error);
            }
        }

        function updateLessonSelect() {
            const select = document.getElementById('lessonSelect');
            select.innerHTML = '';
            bibleData.forEach((lesson, index) => {
                let opt = document.createElement('option');
                opt.value = index;
                opt.textContent = lesson.title;
                select.appendChild(opt);
            });
            select.value = currentLessonIndex;
        }

        function loadCard() {
            if (bibleData.length === 0) return;
            const lesson = bibleData[currentLessonIndex];
            const verse = lesson.verses[currentVerseIndex];
            
            document.getElementById('frontLessonTitle').textContent = lesson.title;
            document.getElementById('frontRef').textContent = verse.ref;
            document.getElementById('backText').textContent = verse.text;
            
            document.getElementById('progressText').textContent = `Bài ${currentLessonIndex + 1} | Câu ${currentVerseIndex + 1} / ${lesson.verses.length}`;
            
            if(isFlipped) {
                flipCard();
            }
        }

        function flipCard() {
            const card = document.getElementById('card');
            card.classList.toggle('flipped');
            isFlipped = !isFlipped;
        }

        function nextVerse() {
            const lesson = bibleData[currentLessonIndex];
            if (currentVerseIndex < lesson.verses.length - 1) {
                currentVerseIndex++;
            } else {
                currentVerseIndex = 0; 
            }
            loadCard();
        }

        function prevVerse() {
            const lesson = bibleData[currentLessonIndex];
            if (currentVerseIndex > 0) {
                currentVerseIndex--;
            } else {
                currentVerseIndex = lesson.verses.length - 1; 
            }
            loadCard();
        }

        function changeLesson() {
            const select = document.getElementById('lessonSelect');
            currentLessonIndex = parseInt(select.value);
            currentVerseIndex = 0;
            loadCard();
        }

        function selectRandomLesson() {
            if (bibleData.length === 0) return;
            currentLessonIndex = Math.floor(Math.random() * bibleData.length);
            currentVerseIndex = 0;
            updateLessonSelect();
            loadCard();
        }

        // Tải nội dung file Markdown trực tiếp từ URL GitHub (khuyên dùng link dạng Raw)
        async function fetchMarkdownFromUrl() {
            let url = document.getElementById('mdUrlInput').value.trim();
            if (!url) {
                alert("Vui lòng dán link file Markdown!");
                return;
            }

            // Nếu người dùng dán link GitHub dạng thông thường, tự đổi sang raw.githubusercontent.com cho chuẩn
            if (url.includes("github.com") && !url.includes("raw.githubusercontent.com")) {
                url = url.replace("github.com", "raw.githubusercontent.com").replace("/blob/", "/");
            }

            try {
                document.getElementById('progressText').textContent = "Đang tải dữ liệu từ link...";
                const response = await fetch(url);
                if (!response.ok) throw new Error("Không thể tải được nội dung từ link này.");
                
                const mdText = await response.text();
                
                // Lấy tên file từ URL làm tiêu đề bài
                let urlParts = url.split('/');
                let fileName = urlParts[urlParts.length - 1].replace(/\.md$/i, '').replace(/%20/g, ' ');
                let lessonTitle = fileName.trim();

                const lines = mdText.split(/\r?\n/);
                let versesList = [];
                
                lines.forEach(line => {
                    let cleanLine = line.trim();
                    if (cleanLine && !cleanLine.startsWith('#') && cleanLine.includes(':')) {
                        versesList.push({
                            ref: cleanLine,
                            text: "Nội dung câu Kinh Thánh (bạn có thể copy sang đây hoặc gửi tôi match bản 1934)..."
                        });
                    }
                });

                if (versesList.length === 0) {
                    alert("Không tìm thấy dòng tham chiếu Kinh Thánh nào trong file này!");
                    return;
                }

                const newId = bibleData.length > 0 ? bibleData[bibleData.length - 1].id + 1 : 1;

                const newLesson = {
                    id: newId,
                    title: lessonTitle,
                    verses: versesList
                };

                bibleData.push(newLesson);
                currentLessonIndex = bibleData.length - 1;
                currentVerseIndex = 0;
                
                updateLessonSelect();
                loadCard();

                document.getElementById('downloadJsonBtn').style.display = 'block';
                alert(`Đã tải và xử lý thành công bài "${lessonTitle}" (${versesList.length} câu)! Bây giờ bạn có thể bấm "Tải xuống data.json mới".`);
            } catch (error) {
                alert("Lỗi tải link: " + error.message);
                loadCard();
            }
        }

        // Tải file data.json mới về máy để đưa lên GitHub
        function downloadUpdatedJson() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(bibleData, null, 4));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "data.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        window.onload = loadDatabase;
    </script>
</body>
</html>
