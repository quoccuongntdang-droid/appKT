<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dẫn Giải Tóm Lược — Bài 1.1 (V2)</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #eef2f6; margin: 0; padding: 16px; color: #2c3e50; }
        .wrap { max-width: 780px; margin: 0 auto; background: #fff; border-radius: 16px; padding: 22px; box-shadow: 0 6px 22px rgba(0,0,0,0.08); }
        .top-bar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; border-bottom: 1px solid #e5e7eb; padding-bottom: 14px; margin-bottom: 16px; }
        .btn { border: none; border-radius: 8px; padding: 9px 13px; font-size: 13px; font-weight: bold; cursor: pointer; color: #fff; text-decoration: none; display: inline-block; }
        .btn-blue { background: #2980b9; }
        .btn-green { background: #27ae60; }
        .btn-gray { background: #7f8c8d; }
        .sum-card { background: #f8fafc; border-left: 4px solid #2980b9; border: 1px solid #e2e8f0; border-left-width: 4px; border-radius: 10px; padding: 14px; margin-bottom: 12px; }
        .sum-title { font-weight: bold; font-size: 15px; color: #1e293b; margin-bottom: 6px; }
        .sum-text { font-size: 14px; line-height: 1.6; color: #334155; }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="top-bar">
            <div>
                <h2 style="margin:0;font-size:20px;">📌 Dẫn Giải Tóm Lược — Bài 1.1</h2>
                <div style="font-size:12px;color:#64748b;margin-top:3px;" id="subTitle">Đang tải...</div>
            </div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
                <a href="/read-v2" class="btn btn-blue">📖 Đọc Toàn Bộ</a>
                <a href="/verses-v2" class="btn btn-green">📜 Câu Kinh Thánh</a>
                <a href="/topics" class="btn btn-gray">⬅️ Trang Chính</a>
            </div>
        </div>
        <div id="summaryList"></div>
    </div>

    <script>
        function escapeHtml(str) {
            return String(str ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }
        async function loadSummaries() {
            const res = await fetch('/api/v2/stage1-lesson1');
            const json = await res.json();
            if (!res.ok || !json.success) return;
            document.getElementById('subTitle').textContent = `${json.content.stageName} • Bài ${json.content.lessonCode}: ${json.content.lessonTitle}`;
            const box = document.getElementById('summaryList');
            box.innerHTML = '';
            (json.content.sections || []).forEach(sec => {
                box.innerHTML += `
                    <div class="sum-card">
                        <div class="sum-title">${escapeHtml(sec.sectionTitle)}</div>
                        <div class="sum-text">${escapeHtml(sec.summary || '(Chưa có dẫn giải tóm lược)')}</div>
                    </div>
                `;
            });
        }
        window.onload = loadSummaries;
    </script>
</body>
</html>
