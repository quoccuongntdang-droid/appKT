<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đọc Toàn Bộ Bài 1.1 — V2</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #eef2f6;
            margin: 0;
            padding: 16px;
            color: #2c3e50;
        }
        .wrap {
            max-width: 820px;
            margin: 0 auto;
            background: #fff;
            border-radius: 16px;
            padding: 22px;
            box-shadow: 0 6px 22px rgba(0, 0, 0, 0.08);
        }
        .top-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid #e5e7eb;
            padding-bottom: 14px;
            margin-bottom: 16px;
        }
        .badge {
            display: inline-block;
            background: #e8f4fd;
            color: #1f618d;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: bold;
        }
        .btn {
            border: none;
            border-radius: 8px;
            padding: 9px 13px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            color: #fff;
            text-decoration: none;
            display: inline-block;
        }
        .btn-blue { background: #2980b9; }
        .btn-blue:hover { background: #2471a3; }
        .btn-orange { background: #e67e22; }
        .btn-orange:hover { background: #ca6f1e; }
        .btn-gray { background: #7f8c8d; }
        .btn-gray:hover { background: #6c7a7b; }

        .toc-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 18px;
            padding: 10px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
        }
        .toc-link {
            font-size: 12.5px;
            font-weight: bold;
            color: #1d4ed8;
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            padding: 6px 10px;
            border-radius: 7px;
            text-decoration: none;
        }
        .toc-link:hover { background: #dbeafe; }

        .section-block {
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 18px;
            background: #fafcff;
        }
        .section-heading {
            margin: 0 0 12px 0;
            font-size: 17px;
            color: #1e293b;
        }
        .point-card {
            background: #fff;
            border-left: 4px solid #3498db;
            border-radius: 8px;
            padding: 12px 14px;
            margin-bottom: 12px;
        }
        .point-label {
            font-size: 12px;
            font-weight: bold;
            color: #2980b9;
            margin-bottom: 6px;
        }
        .explanation {
            font-size: 14px;
            line-height: 1.65;
            margin-bottom: 10px;
            white-space: pre-line;
        }
        .verse-box {
            background: #fef9e7;
            border: 1px solid #f7dc6f;
            border-radius: 8px;
            padding: 10px 12px;
            margin-top: 8px;
        }
        .verse-ref {
            font-weight: bold;
            color: #9a7d0a;
            font-size: 13px;
            margin-bottom: 4px;
        }
        .verse-text {
            font-size: 13.5px;
            line-height: 1.55;
            color: #333;
        }
        .summary-box {
            background: #eaf4fc;
            border-left: 4px solid #2980b9;
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 13.5px;
            line-height: 1.6;
            margin-top: 8px;
        }
        .auth-gate {
            text-align: center;
            padding: 28px 16px;
            border: 1px solid #fecaca;
            background: #fef2f2;
            border-radius: 12px;
            color: #991b1b;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="top-bar">
            <div>
                <span class="badge" id="metaBadge">Giai đoạn 1 • Bài 1-1</span>
                <h2 style="margin:6px 0 0 0;font-size:20px;" id="lessonTitle">Đang tải toàn bộ bài học...</h2>
                <div style="font-size:12px;color:#64748b;margin-top:3px;" id="studentInfoLine"></div>
            </div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
                <a href="/study-v2" class="btn btn-orange">📝 Học & Kiểm Tra Từng Phần</a>
                <a href="/topics" class="btn btn-gray">⬅️ Về trang chính</a>
            </div>
        </div>

        <div id="authGate" class="auth-gate hidden">
            <h3 style="margin-top:0;">🔒 Vui lòng đăng nhập tài khoản học viên trước</h3>
            <p>Bạn cần đăng nhập ở trang chính để mở bài đọc toàn bộ.</p>
            <a href="/login" class="btn btn-blue">Đăng nhập ngay</a>
        </div>

        <div id="readerContent" class="hidden">
            <div class="toc-bar" id="tocBar"></div>
            <div id="sectionsContainer"></div>
        </div>
    </div>

    <script>
        const STUDENT_STORAGE_KEY = 'bible_persistent_student_v1';

        function getLoggedInStudent() {
            try {
                const raw = localStorage.getItem(STUDENT_STORAGE_KEY);
                if (!raw) return null;
                const parsed = JSON.parse(raw);
                return parsed && parsed.username ? parsed : null;
            } catch {
                return null;
            }
        }

        function escapeHtml(str) {
            return String(str ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function renderFullLesson(data) {
            document.getElementById('metaBadge').textContent = `${data.stageName || 'Giai đoạn 1'} • Bài ${data.lessonCode || '1-1'}`;
            document.getElementById('lessonTitle').textContent = data.lessonTitle || 'Bài 1.1';

            const tocBar = document.getElementById('tocBar');
            const secContainer = document.getElementById('sectionsContainer');
            tocBar.innerHTML = '';
            secContainer.innerHTML = '';

            (data.sections || []).forEach(sec => {
                const anchorId = `sec-${sec.sectionId}`;
                const tocA = document.createElement('a');
                tocA.className = 'toc-link';
                tocA.href = `#${anchorId}`;
                tocA.textContent = `Phần ${sec.sectionOrder}`;
                tocBar.appendChild(tocA);

                let pointsHtml = '';
                (sec.points || []).forEach(pt => {
                    let versesHtml = '';
                    (pt.verses || []).forEach(v => {
                        versesHtml += `
                            <div class="verse-box">
                                <div class="verse-ref">📖 ${escapeHtml(v.ref)}</div>
                                <div class="verse-text">${escapeHtml(v.text || '')}</div>
                            </div>
                        `;
                    });
                    pointsHtml += `
                        <div class="point-card">
                            <div class="point-label">Ý ${pt.pointOrder}</div>
                            <div class="explanation">${escapeHtml(pt.explanation)}</div>
                            ${versesHtml}
                        </div>
                    `;
                });

                const block = document.createElement('div');
                block.className = 'section-block';
                block.id = anchorId;
                block.innerHTML = `
                    <h3 class="section-heading">${escapeHtml(sec.sectionTitle)}</h3>
                    ${pointsHtml}
                    ${sec.summary ? `<div class="summary-box"><b>Tóm lược phần:</b> ${escapeHtml(sec.summary)}</div>` : ''}
                `;
                secContainer.appendChild(block);
            });
        }

        async function initReader() {
            const student = getLoggedInStudent();
            if (!student) {
                document.getElementById('authGate').classList.remove('hidden');
                return;
            }
            document.getElementById('studentInfoLine').textContent = `Tài khoản học viên: ${student.username}`;
            document.getElementById('readerContent').classList.remove('hidden');

            try {
                const res = await fetch('/api/v2/stage1-lesson1');
                const json = await res.json();
                if (!res.ok || !json.success || !json.content) {
                    throw new Error(json.message || 'Không tải được nội dung bài học');
                }
                renderFullLesson(json.content);
            } catch (err) {
                document.getElementById('lessonTitle').textContent = 'Lỗi tải bài đọc: ' + err.message;
            }
        }

        window.onload = initReader;
    </script>
</body>
</html>
